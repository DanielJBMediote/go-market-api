spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/go_market}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:go_market}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:G0M4rk3t@26}

# Configurações do Hibernate (opcional)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
